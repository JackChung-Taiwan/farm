<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9e9"/><stop offset="1" stop-color="#fff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter></defs><rect width="900" height="1200" fill="url(#g)"/><text x="70" y="95" fill="#1d7b37" font-size="30" font-weight="700">智在家鄉 × 都市小農 × AI農業助理</text><text x="70" y="185" fill="#12351e" font-size="62" font-weight="900">不佔空間，</text><text x="70" y="260" fill="#12351e" font-size="62" font-weight="900">也能種出一座小農場</text><text x="70" y="330" fill="#243b2a" font-size="25">結合垂直農業、物聯網感測、Open Data 與 AI 分析，</text><text x="70" y="370" fill="#243b2a" font-size="25">讓陽台、屋頂、校園與小農地都能成為智慧蔬菜基地。</text><g filter="url(#s)" transform="translate(505 125)"><rect x="0" y="0" width="270" height="390" rx="22" fill="#f7faf6" stroke="#b7c9b6" stroke-width="6"/><rect x="22" y="55" width="226" height="70" rx="12" fill="#222"/><rect x="22" y="155" width="226" height="70" rx="12" fill="#222"/><rect x="22" y="255" width="226" height="70" rx="12" fill="#222"/><g fill="#6db84d"><circle cx="60" cy="88" r="18"/><circle cx="120" cy="88" r="20"/><circle cx="180" cy="88" r="18"/><circle cx="75" cy="188" r="18"/><circle cx="135" cy="188" r="20"/><circle cx="195" cy="188" r="18"/><circle cx="65" cy="288" r="18"/><circle cx="130" cy="288" r="20"/><circle cx="200" cy="288" r="18"/></g><circle cx="135" cy="205" r="23" fill="#fff" stroke="#ddd"/><circle cx="125" cy="203" r="4" fill="#777"/><circle cx="145" cy="203" r="4" fill="#777"/></g><g transform="translate(60 455)"><g fill="#2e8f43"><circle cx="40" cy="40" r="36"/><circle cx="235" cy="40" r="36"/><circle cx="430" cy="40" r="36"/></g><text x="90" y="35" font-size="22" fill="#196b32" font-weight="800">垂直種植</text><text x="90" y="66" font-size="18">節省空間，高效利用每一層</text><text x="285" y="35" font-size="22" fill="#196b32" font-weight="800">感測聯網</text><text x="285" y="66" font-size="18">即時監測環境，自動記錄數據</text><text x="480" y="35" font-size="22" fill="#196b32" font-weight="800">AI 分析建議</text><text x="480" y="66" font-size="18">數據輔助決策，提升作物品質</text></g><rect x="45" y="610" width="810" height="185" rx="24" fill="#f2fbef" stroke="#c7dfbe"/><text x="85" y="665" font-size="32" fill="#1b7534" font-weight="900">設備特色</text><text x="105" y="725" font-size="24" fill="#1b7534" font-weight="800">四層垂直設計　環境監測　物聯網連線　智慧栽培管理</text><text x="105" y="765" font-size="20" fill="#445544">小空間大產量，適合陽台、室內、校園與小農地使用。</text><text x="320" y="880" font-size="38" fill="#1b7534" font-weight="900">從數據到收穫</text><text x="210" y="930" font-size="23" fill="#344">智慧設備 × 物聯網 × AI 助理，打造永續、高效、安心的都市農場新模式。</text><rect x="260" y="990" width="380" height="70" rx="35" fill="#2c8a3a"/><text x="330" y="1036" font-size="26" fill="#fff" font-weight="900">立即體驗智慧小農場</text></svg>