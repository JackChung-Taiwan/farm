<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f6fff3"/><text x="450" y="62" font-size="42" font-weight="900" fill="#1d7134" text-anchor="middle">第 2 頁｜即時監控與智慧提醒</text><g fill="#fff" stroke="#2b7a3a" stroke-width="6"><rect x="30" y="95" width="405" height="500" rx="25"/><rect x="465" y="95" width="405" height="500" rx="25"/><rect x="30" y="625" width="405" height="500" rx="25"/><rect x="465" y="625" width="405" height="500" rx="25"/></g><g font-family="Arial,'Microsoft JhengHei'" fill="#14351e"><text x="55" y="145" font-size="30" font-weight="900">1 即時監控</text><rect x="115" y="205" width="230" height="320" rx="35" fill="#222"/><rect x="135" y="245" width="190" height="240" rx="18" fill="#f4fff2"/><text x="230" y="290" font-size="24" text-anchor="middle" font-weight="900">智慧小農場</text><text x="160" y="340" font-size="20">溫度 26.4°C</text><text x="160" y="380" font-size="20">濕度 68%</text><text x="160" y="420" font-size="20">光照 420 lux</text><text x="55" y="555" font-size="26" fill="#22833c" font-weight="900">打開頁面，狀況一看就懂</text><text x="490" y="145" font-size="30" font-weight="900">2 歷史紀錄</text><polyline points="520,420 580,360 640,385 700,300 790,260" fill="none" stroke="#31a354" stroke-width="10" stroke-linecap="round"/><rect x="520" y="205" width="300" height="320" rx="22" fill="#f7fff5" stroke="#bdd6b5"/><text x="550" y="250" font-size="24" font-weight="900">成長趨勢圖</text><text x="490" y="555" font-size="26" fill="#22833c" font-weight="900">環境變化都被記錄下來</text><text x="55" y="675" font-size="30" font-weight="900">3 AI 栽培建議</text><text x="75" y="740" font-size="24">依照數據提供照顧建議：</text><text x="85" y="800" font-size="24" fill="#238b45">✓ 光照延長至 14 小時</text><text x="85" y="850" font-size="24" fill="#238b45">✓ 土壤偏低，建議補水</text><text x="85" y="900" font-size="24" fill="#238b45">✓ 明早適合施肥</text><text x="225" y="1010" font-size="90" text-anchor="middle">💡</text><text x="490" y="675" font-size="30" font-weight="900">4 警示通知</text><rect x="550" y="735" width="250" height="250" rx="28" fill="#fbfff4" stroke="#bdd6b5"/><text x="675" y="795" font-size="30" text-anchor="middle" font-weight="900">警示通知</text><text x="580" y="860" font-size="24">💧 土壤濕度過低</text><text x="580" y="910" font-size="24">☀️ 溫度過高</text><text x="580" y="960" font-size="24">⚠️ 水泵異常</text><text x="490" y="1065" font-size="28" fill="#22833c" font-weight="900">異常立即處理，守護作物健康</text></g><rect x="80" y="1140" width="740" height="42" rx="21" fill="#2b8a3e"/><text x="450" y="1170" font-size="24" fill="#fff" text-anchor="middle" font-weight="900">讓農場管理變成手機裡的小幫手</text></svg>