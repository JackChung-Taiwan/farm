<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f6fff1"/><text x="450" y="62" font-size="42" font-weight="900" fill="#1d7134" text-anchor="middle">第 3 頁｜從資料到收穫</text><g fill="#fff" stroke="#2b7a3a" stroke-width="6"><rect x="30" y="95" width="405" height="500" rx="25"/><rect x="465" y="95" width="405" height="500" rx="25"/><rect x="30" y="625" width="405" height="500" rx="25"/><rect x="465" y="625" width="405" height="500" rx="25"/></g><g font-family="Arial,'Microsoft JhengHei'" fill="#14351e"><text x="55" y="145" font-size="30" font-weight="900">1 遠端管理好方便</text><text x="55" y="200" font-size="24">不用一直守在旁邊，</text><text x="55" y="240" font-size="24">也能掌握農場狀況。</text><text x="225" y="390" font-size="120" text-anchor="middle">📱</text><text x="55" y="555" font-size="26" fill="#22833c" font-weight="900">一手掌握智慧小農場</text><text x="490" y="145" font-size="30" font-weight="900">2 多場域都適用</text><text x="510" y="220" font-size="44">陽台　屋頂</text><text x="510" y="300" font-size="44">校園　小農地</text><text x="660" y="425" font-size="130" text-anchor="middle">🌱</text><text x="490" y="555" font-size="26" fill="#22833c" font-weight="900">任何角落都能變智慧菜園</text><text x="55" y="675" font-size="30" font-weight="900">3 Open Data＋AI 分析</text><rect x="70" y="735" width="330" height="210" rx="22" fill="#fbfff6" stroke="#bdd6b5"/><text x="105" y="800" font-size="24">天氣溫度　降雨濕度</text><text x="105" y="850" font-size="24">光照強度　土壤水分</text><text x="105" y="900" font-size="24">結合環境資料判斷</text><text x="225" y="1040" font-size="90" text-anchor="middle">☁️</text><text x="490" y="675" font-size="30" font-weight="900">4 開啟智慧小農生活</text><text x="515" y="740" font-size="24">科技種菜，生活更綠。</text><text x="515" y="790" font-size="24">從今天開始，讓蔬菜安心長大。</text><text x="665" y="940" font-size="130" text-anchor="middle">🥬</text><text x="490" y="1065" font-size="28" fill="#22833c" font-weight="900">從數據到收穫，讓科技成為農業夥伴</text></g><rect x="80" y="1140" width="740" height="42" rx="21" fill="#2b8a3e"/><text x="450" y="1170" font-size="24" fill="#fff" text-anchor="middle" font-weight="900">智在家鄉 × 都市小農 × AI 農業助理</text></svg>